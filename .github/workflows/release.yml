name: Release AAR

# Build the library AAR on every version tag push and publish it as a
# GitHub Release asset. No extra secrets are required: it uses the
# automatically-provided GITHUB_TOKEN.
#
# To publish a new release:
#   git tag v2.0.0
#   git push origin v2.0.0

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required to create the release and upload assets

jobs:
  build:
    name: Build & Release AAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify version tag
        run: |
          EXPECTED="${GITHUB_REF_NAME#v}"
          ACTUAL="$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)"
          test "$EXPECTED" = "$ACTUAL"
          echo "Publishing version: $ACTUAL"

      - name: Extract version from tag
        id: version
        run: |
          # Strip the leading "v" from the tag (v1.1.0 -> 1.1.0)
          TAG="${GITHUB_REF_NAME#v}"
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $TAG"

      - name: Build release AAR
        run: ./gradlew clean :app:testDebugUnitTest :app:lintRelease :app:assembleRelease --no-daemon --stacktrace

      - name: Rename AAR
        id: aar
        run: |
          SRC="app/build/outputs/aar/app-release.aar"
          DEST="app/build/outputs/aar/scanner-${{ steps.version.outputs.name }}.aar"
          mv "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          echo "Produced: $DEST"

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: scanner-${{ steps.version.outputs.name }}
          path: ${{ steps.aar.outputs.path }}
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: ${{ steps.aar.outputs.path }}
